name = "coddi-changelog"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Non-secret configuration. The three secrets (META_TOKEN, GOOGLE_SA_KEY,
# SHEET_ID) are set with `wrangler secret put` — see README.md.
[vars]
AD_ACCOUNT_ID = "904315886897104"

# DISABLED 2026-09-13 at the owner's request. It must not run unless the owner
# explicitly asks for it again. An empty list removes every schedule on deploy.
#
# To re-enable: restore the two entries below and set a RUN_TOKEN secret.
#   crons = ["0 */2 * * *", "30 3 * * *"]
# (2-hourly incremental run, plus a daily reconciliation sweep; the second entry
# must stay in step with RECONCILE_CRON in src/index.js.)
[triggers]
crons = []

# Cursor storage. Replace `id` with the value printed by:
#   npx wrangler kv namespace create CHANGELOG_KV
[[kv_namespaces]]
binding = "CHANGELOG_KV"
id = "a64a7b9371fb4517ad4118e5dfe333eb"

[observability]
enabled = true
