name = "coddi-changelog"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Non-secret configuration. The three secrets (META_TOKEN, GOOGLE_SA_KEY,
# SHEET_ID) are set with `wrangler secret put` — see README.md.
[vars]
AD_ACCOUNT_ID = "904315886897104"

# Every 2 hours for the incremental run, plus a daily reconciliation sweep that
# recovers changes Meta never logged. The second entry must stay in step with
# RECONCILE_CRON in src/index.js.
[triggers]
crons = ["0 */2 * * *", "30 3 * * *"]

# Cursor storage. Replace `id` with the value printed by:
#   npx wrangler kv namespace create CHANGELOG_KV
[[kv_namespaces]]
binding = "CHANGELOG_KV"
id = "a64a7b9371fb4517ad4118e5dfe333eb"

[observability]
enabled = true
